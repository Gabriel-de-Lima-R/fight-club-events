<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fight Club · Agenda do UFC</title>
  <meta name="description" content="Agenda gratuita dos próximos eventos do UFC, com horários de Brasília e onde assistir.">
  <meta name="theme-color" content="#c8102e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c8102e'/%3E%3Ctext x='32' y='46' font-family='Arial,sans-serif' font-size='40' font-weight='700' fill='%23fff' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <div class="container">
      <h1 class="marca">Fight Club</h1>
      <p class="subtitulo">Agenda dos próximos eventos do UFC · horários de Brasília</p>
    </div>
  </header>

  <nav class="container abas" role="tablist" aria-label="Seções">
    <button class="aba" role="tab" id="aba-agenda" aria-controls="painel-agenda" aria-selected="true">Agenda</button>
    <button class="aba" role="tab" id="aba-calendario" aria-controls="painel-calendario" aria-selected="false" tabindex="-1">Calendário</button>
  </nav>

  <main class="container">
    <section id="painel-agenda" role="tabpanel" aria-labelledby="aba-agenda">
      <div class="filtros" id="filtros" role="group" aria-label="Filtrar por tipo de evento" hidden>
        <button class="filtro" type="button" data-filtro="todos" aria-pressed="true">Todos</button>
        <button class="filtro" type="button" data-filtro="numerado" aria-pressed="false" title="Eventos numerados, como UFC 333">Numerados</button>
        <button class="filtro" type="button" data-filtro="fight-night" aria-pressed="false">Fight Night</button>
      </div>
      <p class="mensagem" id="agenda-status">Carregando eventos…</p>
      <ol class="lista-eventos" id="lista-eventos"></ol>
    </section>

    <section id="painel-calendario" role="tabpanel" aria-labelledby="aba-calendario" hidden>
      <p class="mensagem" id="calendario-status">Carregando calendário…</p>
      <div id="calendario" hidden>
        <div class="cal-cabecalho">
          <button class="cal-botao" id="cal-anterior" type="button" aria-label="Mês anterior">‹</button>
          <h2 class="cal-titulo" id="cal-titulo" aria-live="polite"></h2>
          <button class="cal-botao" id="cal-proximo" type="button" aria-label="Próximo mês">›</button>
        </div>
        <div class="cal-grade" id="cal-grade"></div>
        <button class="cal-botao-hoje" id="cal-hoje" type="button">Hoje</button>
        <div class="cal-detalhe" id="cal-detalhe"></div>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <div class="container">
      <p>Site independente, sem afiliação com o UFC.</p>
      <p>Dados atualizados em <span id="ultima-atualizacao">—</span>.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/calendario.js"></script>
</body>
</html>
